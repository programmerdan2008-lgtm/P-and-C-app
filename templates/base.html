  <script>
    // Some Android WebViews (common inside installed/standalone PWAs) don't
    // size 100dvh the same way the regular mobile browser tab does, which is
    // why layouts that look right in-browser get clipped once installed.
    // window.innerHeight is what's actually visible on every device, so we
    // mirror it into a CSS var and every full-height rule below falls back
    // to it instead of trusting dvh alone.
    (function () {
      function setAppHeight() {
        document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
      }
      setAppHeight();
      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 250); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
    })();
  </script>

          '<button class="btn secondary" type="button"></button><button class="btn" type="button"></button></div></div>';
        var q = m.querySelectorAll('h2,p,button');
        q[0].textContent = title; q[1].textContent = text; q[2].textContent = 'Cancel'; q[3].textContent = okLabel;
        if (danger) q[3].style.background = '#e53950';
        function done(v) { m.remove(); resolve(v); }
        q[2].onclick = function () { done(false); };
        q[3].onclick = function () { done(true); };
        m.addEventListener('click', function (e) { if (e.target === m) done(false); });
        document.body.appendChild(m);
      });
    }
    return { token: token, api: api, toast: toast, confirm: confirmBox };
  })();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' }).then(reg => reg.update()).catch(() => {}));
  }
  window.addEventListener('load', () => {
    setTimeout(() => { if (typeof maybeShowNotificationPrompt === 'function') maybeShowNotificationPrompt(); }, 1500);
  });
</script>
